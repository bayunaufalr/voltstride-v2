# Analyzer tetap memeriksa kesalahan Dart yang membuat build gagal.
# Aturan gaya non-blocking dinonaktifkan agar hasil Actions tidak dibanjiri
# ratusan saran format/konstanta yang tidak menghalangi APK dibuat.
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    unused_element: error
    unused_local_variable: error
  exclude:
    - build/**
    - android/**

linter:
  rules:
    avoid_empty_else: false
    always_declare_return_types: false
    require_trailing_commas: false
    unawaited_futures: false
    lines_longer_than_80_chars: false
    prefer_single_quotes: false
    avoid_print: false
    prefer_is_empty: false
    prefer_is_not_empty: false
    prefer_final_locals: false
    prefer_const_constructors: false
    prefer_const_declarations: false
    prefer_const_literals_to_create_immutables: false
    use_build_context_synchronously: false
    prefer_if_null_operators: false
    non_constant_identifier_names: false
