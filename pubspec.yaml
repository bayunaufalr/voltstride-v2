name: voltstride
description: "VoltStride - GPS running, race planning, strength training, workout timer, and training data export."
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  geolocator: ^13.0.2
  http: ^1.2.2
  url_launcher: ^6.3.1
  path: ^1.9.1
  sqflite: ^2.4.4+1
  file_picker: ^12.3.0
  image: ^4.5.4
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  permission_handler: ^12.0.3
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.3
  # Hindari shared_preferences_android 2.5.0+ pada APK release Android;
  # versi tersebut dapat gagal dipanggil setelah optimasi R8/JNI.
  shared_preferences_android: '>=2.4.28 <2.5.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
