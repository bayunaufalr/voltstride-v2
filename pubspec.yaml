name: voltstride
description: "VoltStride - Running engine, local run history, AI running coach, race planning, workouts, and strength training."
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.2
  http: ^1.2.2
  url_launcher: ^6.3.1
  path: ^1.9.1
  sqflite: ^2.4.4+1
  file_picker: ^12.3.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  permission_handler: ^12.0.3
  flutter_local_notifications: ^19.5.0
  pedometer: ^4.2.0
  share_plus: ^13.3.1
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
