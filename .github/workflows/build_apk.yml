name: Build VoltStride APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check, test, and build Android APK
    runs-on: ubuntu-latest
    env:
      # Konfigurasi Firebase diambil dari GitHub repository secrets.
      VOLTSTRIDE_FIREBASE_API_KEY: ${{ secrets.VOLTSTRIDE_FIREBASE_API_KEY }}
      VOLTSTRIDE_FIREBASE_APP_ID: ${{ secrets.VOLTSTRIDE_FIREBASE_APP_ID }}
      VOLTSTRIDE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VOLTSTRIDE_FIREBASE_MESSAGING_SENDER_ID }}
      VOLTSTRIDE_FIREBASE_PROJECT_ID: ${{ secrets.VOLTSTRIDE_FIREBASE_PROJECT_ID }}

      # Dua secret ini opsional. Tanpa keduanya, APK dibuat dengan debug key
      # agar bisa diuji di HP, tetapi bukan untuk diunggah ke Google Play.
      VOLTSTRIDE_KEYSTORE_BASE64: ${{ secrets.VOLTSTRIDE_KEYSTORE_BASE64 }}
      VOLTSTRIDE_KEYSTORE_PASSWORD: ${{ secrets.VOLTSTRIDE_KEYSTORE_PASSWORD }}

    steps:
      - name: Ambil kode dari GitHub
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Siapkan Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Periksa versi Flutter
        run: flutter --version

      - name: Buat konfigurasi Firebase untuk build ini
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          # Nama secret dan keterangan supaya pesan kegagalan mudah dipahami.
          secret_yang_diperlukan = {
              "API Key": "VOLTSTRIDE_FIREBASE_API_KEY",
              "App ID Android": "VOLTSTRIDE_FIREBASE_APP_ID",
              "Messaging Sender ID": "VOLTSTRIDE_FIREBASE_MESSAGING_SENDER_ID",
              "Project ID": "VOLTSTRIDE_FIREBASE_PROJECT_ID",
          }

          nilai = {
              keterangan: os.environ.get(nama_secret, "").strip()
              for keterangan, nama_secret in secret_yang_diperlukan.items()
          }
          belum_diisi = [nama for nama, isi in nilai.items() if not isi]

          if belum_diisi:
              print("::error::Konfigurasi Firebase belum lengkap. Buat GitHub Secrets berikut:")
              for nama in belum_diisi:
                  print(f"::error::{secret_yang_diperlukan[nama]}")
              sys.exit(1)

          # json.dumps menghasilkan teks yang aman saat dimasukkan ke kode Dart.
          api_key = json.dumps(nilai["API Key"], ensure_ascii=True)
          app_id = json.dumps(nilai["App ID Android"], ensure_ascii=True)
          sender_id = json.dumps(nilai["Messaging Sender ID"], ensure_ascii=True)
          project_id = json.dumps(nilai["Project ID"], ensure_ascii=True)

          isi_file = f'''// File ini dibuat otomatis oleh GitHub Actions.
          // Nilainya berasal dari GitHub Secrets milik proyek Firebase VoltStride.
          import 'package:firebase_core/firebase_core.dart';

          class DefaultFirebaseOptions {{
            static FirebaseOptions get currentPlatform => FirebaseOptions(
                  apiKey: {api_key},
                  appId: {app_id},
                  messagingSenderId: {sender_id},
                  projectId: {project_id},
                );
          }}
          '''

          Path("lib/firebase_options.dart").write_text(isi_file, encoding="utf-8")
          print("Konfigurasi Firebase berhasil disiapkan.")
          PY

      - name: Unduh dependensi proyek
        run: flutter pub get

      - name: Periksa kode Dart
        # dart analyze tidak gagal hanya karena pesan berstatus info.
        # Error dan warning yang sungguhan tetap membuat tahap ini gagal.
        run: dart analyze

      - name: Jalankan pengujian otomatis
        run: flutter test

      - name: Siapkan kunci penandatanganan rilis jika tersedia
        if: ${{ env.VOLTSTRIDE_KEYSTORE_BASE64 != '' && env.VOLTSTRIDE_KEYSTORE_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/key
          printf '%s' "$VOLTSTRIDE_KEYSTORE_BASE64" | base64 --decode > android/key/voltstride-release.jks
          cat > android/key.properties <<EOF
          storePassword=$VOLTSTRIDE_KEYSTORE_PASSWORD
          keyPassword=$VOLTSTRIDE_KEYSTORE_PASSWORD
          keyAlias=voltstride
          storeFile=key/voltstride-release.jks
          EOF

      - name: Jelaskan kunci pengujian
        if: ${{ env.VOLTSTRIDE_KEYSTORE_BASE64 == '' || env.VOLTSTRIDE_KEYSTORE_PASSWORD == '' }}
        run: echo "::warning::Kunci rilis belum diatur. APK akan memakai debug key untuk pengujian, bukan untuk publikasi Google Play."

      - name: Buat APK Android
        run: flutter build apk --release --split-per-abi

      - name: Simpan APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltstride-apk-release
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
